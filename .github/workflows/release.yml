name: Release app
on:
  release:
    types: [published]
jobs:
  build:
    strategy:
      matrix:
        os:
          [
            { name: 'linux', image: 'ubuntu-latest' },
            { name: 'windows', image: 'windows-latest' },
            { name: 'macos', image: 'macos-latest' },
          ]
    runs-on: ${{ matrix.os.image }}
    steps:
      - name: Github checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Set package.json version from tag
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          npm version --no-git-tag-version "$TAG"
        shell: bash
      - name: Install NSIS (Windows only)
        if: matrix.os.name == 'windows'
        run: |
          choco install nsis
        shell: pwsh

      - name: Build app
        run: npm run build
      - name: Publish app
        timeout-minutes: 10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-forge publish
        shell: bash
      - name: Build custom installer (Windows only)
        if: matrix.os.name == 'windows'
        run: |
          $env:PATH += ";C:\Program Files (x86)\NSIS"
          makensis installer.nsi
        shell: pwsh

      - name: Sign installer (Windows build on Ubuntu)
        if: matrix.os.name == 'windows' && matrix.os.image == 'ubuntu-latest'
        run: |
          echo "${{ secrets.WIN_CERT_FILE_B64 }}" | base64 -d > win-certificate.pfx
          openssl pkcs12 -in win-certificate.pfx -nocerts -out key.pem -nodes -passin pass:${{ secrets.WIN_CERT_PASSWORD }}
          openssl pkcs12 -in win-certificate.pfx -clcerts -nokeys -out cert.pem -passin pass:${{ secrets.WIN_CERT_PASSWORD }}
          sudo apt-get update && sudo apt-get install -y osslsigncode
          osslsigncode sign \
            -certs cert.pem \
            -key key.pem \
            -n "HBK Device Discovery" \
            -i https://www.hbm.com/ \
            -t http://timestamp.digicert.com \
            -in HBK_Device_Discovery_Installer.exe \
            -out HBK_Device_Discovery_Installer-signed.exe
          mv HBK_Device_Discovery_Installer-signed.exe HBK_Device_Discovery_Installer.exe
        shell: bash
      - name: Upload custom installer to release (Windows only)
        if: matrix.os.name == 'windows'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./HBK_Device_Discovery_Installer.exe
          asset_name: HBK_Device_Discovery_Installer.exe
          asset_content_type: application/octet-stream
