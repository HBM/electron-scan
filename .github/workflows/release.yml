name: Release app
on:
  release:
    types: [published]
jobs:
  build:
    strategy:
      matrix:
        os:
          [
            { name: 'linux', image: 'ubuntu-latest' },
            { name: 'windows', image: 'windows-latest' },
            { name: 'macos', image: 'macos-latest' },
          ]
    runs-on: ${{ matrix.os.image }}
    steps:
      - name: Github checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Set package.json version from tag
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          npm version --no-git-tag-version "$TAG"
        shell: bash
      - name: Install NSIS (Windows only)
        if: matrix.os.name == 'windows'
        run: |
          choco install nsis windows-sdk-setup -y
        shell: pwsh
      - name: Decode certificate file (Windows only)
        if: matrix.os.name == 'windows'
        run: |
          echo "${{ secrets.WIN_CERT_FILE_B64 }}" | base64 -d > win-certificate.pfx
        shell: bash

      - name: Build app
        env:
        run: npm run build
      - name: Publish app
        timeout-minutes: 10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-forge publish
        shell: bash
      - name: Build custom installer (Windows only)
        if: matrix.os.name == 'windows'
        run: |
          $env:PATH += ";C:\Program Files (x86)\NSIS"
          makensis installer.nsi
        shell: pwsh

      - name: Sign installer (Windows only)
        if: matrix.os.name == 'windows'
        run: |
          $signtool = Get-ChildItem -Path 'C:\Program Files (x86)\Windows Kits\10\bin\' -Recurse -Filter signtool.exe | Select-Object -First 1
          $signtool_path = $signtool.FullName
          & $signtool_path sign /f win-certificate.pfx /p "${{ secrets.WIN_CERT_PASSWORD }}" /tr http://timestamp.digicert.com /td sha256 /fd sha256 HBK_Device_Discovery_Installer.exe
        shell: pwsh
      - name: Upload custom installer to release (Windows only)
        if: matrix.os.name == 'windows'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./HBK_Device_Discovery_Installer.exe
          asset_name: HBK_Device_Discovery_Installer.exe
          asset_content_type: application/octet-stream
